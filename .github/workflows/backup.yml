name: Backup

# Щомісячна резервна копія Supabase (1-го числа, 02:23 UTC) і запуск вручну.
# Архів зашифрований паролем BACKUP_PASSPHRASE і зберігається як артефакт 90 днів.
# Репозиторій публічний: незашифровані дані сюди не потрапляють. Деталі: docs/backup.md.
on:
  schedule:
    - cron: '23 2 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check secrets
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          missing=""
          [ -z "$SUPABASE_DB_URL" ] && missing="$missing SUPABASE_DB_URL"
          [ -z "$BACKUP_PASSPHRASE" ] && missing="$missing BACKUP_PASSPHRASE"
          if [ -n "$missing" ]; then
            echo "::error::Не налаштовані секрети:$missing. Інструкція: docs/backup.md"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Back up
        id: backup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: bash scripts/backup.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.backup.outputs.name }}
          path: backup-out/
          retention-days: 90
          if-no-files-found: error
